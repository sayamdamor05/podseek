databases:
  - name: podseek-db
    databaseName: podseek
    user: postgres
    plan: free

services:
  - type: web
    name: podseek-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: podseek-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
